<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWPS - Результати пошуку</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles_main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles_sec.css') }}">
    <style>
        /* Стилі для результатів пошуку */
        .search-results-container {
            margin-top: -40px;
            padding: 2rem 5%;
        }

        .results-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 1rem;
            transition: 0.3s;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px var(--neon-pink);
        }

        .result-image {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 1rem;
            border: 2px solid var(--neon-blue);
        }

        .result-info h3 {
            color: var(--neon-blue);
            margin-bottom: 0.5rem;
        }

        .result-info p {
            color: #888;
        }

        .no-results {
            text-align: center;
            font-size: 1.5rem;
            color: var(--neon-pink);
            margin-top: 3rem;
        }

        /* Стилі для кнопок додавання до плейліста */
        .result-card:hover .track-actions {
            display: flex;
        }

        .action-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--cyber-gradient);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .action-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px var(--neon-pink);
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">MWPS</div>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Головна</a>
            <a href="#">Про нас</a>
             <a href="#">Соц. мережі</a>
            <a href="#">Новинки</a>
        </div>
        <div class="auth-buttons">
            <button class="auth-btn">Увійти</button>
            <button class="auth-btn">Реєстрація</button>
        </div>
    </nav>

    <h2 class="section-text">Найкраща бібліотека музики. Знайди своє!</h2>

    <div class="search-container">
        <form action="{{ url_for('home') }}" method="POST">
            <div class="search-box">
                <input type="text" name="search_query" class="search-input" placeholder="Пошук трека...">
                <button type="submit" class="search-btn">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </form>
    </div>

    <div class="search-results-container">
        <h1 class="results-title">Результати пошуку для: {{ query }}</h1>

        {% if results %}
        <div class="results-grid">
            {% for track in results %}
            <div class="result-card" data-track-id="{{ track.id }}">
                <img src="{{ track.image }}" alt="{{ track.title }}" class="result-image">
                <div class="result-info">
                    <h3>{{ track.title }}</h3>
                    <p>{{ track.artist }}</p>
                </div>
                <div class="track-actions">
                    <button class="action-btn" title="Додати до плейліста" onclick="event.stopPropagation(); openAddToPlaylistModal('{{ track.id }}', '{{ track.title }}', '{{ track.artist }}', '{{ track.image }}')">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button class="action-btn" title="Завантажити">
                        <i class="fas fa-download"></i>
                    </button>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <p class="no-results">Нічого не знайдено 😞</p>
        {% endif %}
    </div>

    <!-- Всплывающее модальное окно для выбора плейлиста -->
    <div id="addToPlaylistModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeAddToPlaylistModal()">&times;</span>
        <h2>Виберіть плейліст</h2>
        <div class="playlist-select-container">
            <button class="select-playlist-btn" onclick="togglePlaylistDropdown()">Обрати плейліст</button>
            <div id="playlistDropdown" class="playlist-dropdown">
                <form id="addToPlaylistForm" action="{{ url_for('add_to_playlist') }}" method="POST">
                    <input type="hidden" name="track_id" id="trackId">
                    <input type="hidden" name="track_title" id="trackTitle">
                    <input type="hidden" name="track_artist" id="trackArtist">
                    <input type="hidden" name="track_image" id="trackImage">
                    <select name="playlist_id" required>
                        <option value="" disabled selected>Виберіть плейліст</option>
                        {% for playlist in playlists %}
                        <option value="{{ loop.index0 }}">{{ playlist.name }}</option>
                        {% endfor %}
                    </select>
                    <button type="submit" class="confirm-btn" >Додати</button>
                </form>
            </div>
        </div>
    </div>
    </div>

    <!-- Нижняя панель управления воспроизведением -->
    <div id="player" class="player">
        <div class="player-info">
            <img id="player-track-image" src="" alt="Track Image" class="player-track-image">
            <div class="player-track-details">
                <h3 id="player-track-title"></h3>
                <p id="player-track-artist"></p>
            </div>
        </div>
        <div class="player-controls">
            <button id="play-pause-btn" class="player-btn" title="Play/Pause">
                <i class="fas fa-play"></i>
            </button>
            <button id="speed-up-btn" class="player-btn" title="Speed Up">
                <i class="fas fa-forward"></i>
            </button>
            <button class="action-btn" title="Додати до плейліста" onclick="openAddToPlaylistModal(currentTrack.id, currentTrack.title, currentTrack.artist, currentTrack.image)">
                <i class="fas fa-plus"></i>
            </button>
            <div class="volume-control-container">
                <i class="fas fa-volume-up"></i> <!-- Иконка динамика -->
                <input type="range" id="volume-control" min="0" max="1" step="0.01" value="1" title="Громкість">
            </div>
            <button id="close-player-btn" class="player-btn" title="Close Player">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <input type="range" id="seek-bar" min="0" max="100" value="0" class="seek-bar">
    </div>

    <!-- Аудиоплеер -->
    <audio id="audio-player" src=""></audio>

    <script>
        // Функции для модального окна добавления трека в плейлист
        function openAddToPlaylistModal(trackId, trackTitle, trackArtist, trackImage) {
            document.getElementById("trackId").value = trackId;
            document.getElementById("trackTitle").value = trackTitle;
            document.getElementById("trackArtist").value = trackArtist;
            document.getElementById("trackImage").value = trackImage;
            document.getElementById("addToPlaylistModal").style.display = "block";
        }

        function togglePlaylistDropdown() {
            const dropdown = document.getElementById("playlistDropdown");
            if (dropdown.style.display === "block") {
                dropdown.style.display = "none";
            } else {
                dropdown.style.display = "block";
            }
        }

        function closeAddToPlaylistModal() {
            document.getElementById("addToPlaylistModal").style.display = "none";
            document.getElementById("playlistDropdown").style.display = "none"; // Закрываем выпадающий список при закрытии модального окна
        }

        const player = document.getElementById("player");
        const audioPlayer = document.getElementById("audio-player");
        const playPauseBtn = document.getElementById("play-pause-btn");
        const speedUpBtn = document.getElementById("speed-up-btn");
        const closePlayerBtn = document.getElementById("close-player-btn");
        const seekBar = document.getElementById("seek-bar");
        const volumeControl = document.getElementById("volume-control");
        let currentTrack = null;

        // Функция для открытия плеера и загрузки трека
        function playPreview(trackId, trackTitle, trackArtist, trackImage) {
            fetch(`/get_preview/${trackId}`)
                .then(response => response.json())
                .then(data => {
                    let previewUrl = data.preview_url;
                    if (previewUrl) {
                        document.getElementById("audio-player").src = previewUrl;
                        document.getElementById("player-track-image").src = trackImage;
                        document.getElementById("player-track-title").textContent = trackTitle;
                        document.getElementById("player-track-artist").textContent = trackArtist;
                        document.getElementById("player").classList.add("active");
                        document.getElementById("audio-player").play();

                        currentTrack = { id: trackId, title: trackTitle, artist: trackArtist, image: trackImage };
                    } else {
                        showToast("Цей трек не підтримує прев'ю!");
                    }
                })
                .catch(error => console.error("Ошибка загрузки превью:", error));
        }

        // Добавляем обработчик клика по трекам
        document.querySelectorAll(".result-card").forEach(card => {
            card.addEventListener("click", () => {
                let trackId = card.dataset.trackId;
                let trackTitle = card.querySelector("h3").textContent;
                let trackArtist = card.querySelector("p").textContent;
                let trackImage = card.querySelector("img").src;
                playPreview(trackId, trackTitle, trackArtist, trackImage);
            });
        });

        // Управление воспроизведением
        playPauseBtn.addEventListener("click", () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                audioPlayer.pause();
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            }
        });

        // Ускорение трека
        speedUpBtn.addEventListener("click", () => {
            if (audioPlayer.playbackRate === 1) {
                audioPlayer.playbackRate = 1.5;
            } else {
                audioPlayer.playbackRate = 1;
            }
        });

        // Закрытие плеера
        closePlayerBtn.addEventListener("click", () => {
            player.classList.remove("active");
            audioPlayer.pause();
        });

        // Перемотка трека
        seekBar.addEventListener("input", () => {
            const seekTime = (audioPlayer.duration / 100) * seekBar.value;
            audioPlayer.currentTime = seekTime;
        });

        // Обновление ползунка при воспроизведении
        audioPlayer.addEventListener("timeupdate", () => {
            const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            seekBar.value = progress;
        });

        // Обработчик изменения громкости
        volumeControl.addEventListener("input", () => {
            audioPlayer.volume = volumeControl.value;
        });
    </script>
</body>
</html>
