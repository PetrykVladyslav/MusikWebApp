<nav>
    <div class="logo">MWPS</div>
    <div class="nav-links">
        <a href="/home">Головна</a>
        <a href="/about">Про нас</a>
        <div class="dropdown">
            <a href="#" class="dropbtn">Жанри</a>
            <div class="dropdown-content">
                {% for genre in genres %}
                <a href="{{ url_for('search_by_genre', genre_name=genre.name) }}">{{ genre.name }}</a>
                {% endfor %}
            </div>
        </div>
    </div>
    {% if current_user.is_authenticated %}
    <div class="user-avatar">
        <img src="{{ url_for('static', filename=user.avatar) }}" alt="User Avatar" onclick="v">
        <div id="userDropdown" class="dropdown-content">
            <a href="{{ url_for('user_details') }}">Профіль</a>
            <a href="{{ url_for('logout') }}" class="logout-btn">Вийти</a>
        </div>
    </div>
    {% else %}
    <div class="auth-buttons">
        <button class="auth-btn" onclick="window.location.href='{{ url_for('login') }}'">Увійти</button>
        <button class="auth-btn" onclick="window.location.href='{{ url_for('register') }}'">Реєстрація</button>
    </div>
    {% endif %}
</nav>
